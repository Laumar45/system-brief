<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native PDF Report Viewer</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1e293b; color: white; }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; cursor: pointer; text-decoration: none; font-size: 14px; }
    .btn:hover { background: #475569; }
    .btn-primary { background: #2563eb; border-color: #1d4ed8; }
    .btn-primary:hover { background: #1d4ed8; }
    .viewer-container { flex: 1; width: 100%; height: 100%; position: relative; background: #f1f5f9; }
    iframe, object { width: 100%; height: 100%; border: none; }
    .fallback-message { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div><strong>Monthly Sales Report.pdf</strong></div>
    <div class="actions">
      <button class="btn" onclick="printPdf()">Print</button>
      <a id="downloadBtn" class="btn btn-primary" href="#" download="report.pdf">Download PDF</a>
    </div>
  </div>

  <div class="viewer-container">
    <object id="pdfObject" data="" type="application/pdf" width="100%" height="100%">
      <div class="fallback-message">
        <p>Your browser does not support inline PDF viewing.</p>
        <a id="fallbackDownloadBtn" class="btn btn-primary" href="#" download="report.pdf">Download File Directly</a>
      </div>
    </object>
  </div>

  <script>
    let activeBlobUrl = null;

    async function loadPdfReport(endpointUrl, authToken) {
      try {
        const response = await fetch(endpointUrl, {
          headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
        });
        if (!response.ok) throw new Error('Failed to load PDF');
        
        const blob = await response.blob();
        if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
        const blobUrl = URL.createObjectURL(blob);
        activeBlobUrl = blobUrl;
        
        const pdfObject = document.getElementById('pdfObject');
        const downloadBtn = document.getElementById('downloadBtn');
        const fallbackDownloadBtn = document.getElementById('fallbackDownloadBtn');
        
        pdfObject.data = blobUrl;
        downloadBtn.href = blobUrl;
        fallbackDownloadBtn.href = blobUrl;

        window.addEventListener('pagehide', cleanup, { once: true });
      } catch (err) {
        console.error('PDF Load Error:', err);
      }
    }

    function cleanup() {
      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
    }

    function printPdf() {
      const pdfObject = document.getElementById('pdfObject');
      if (pdfObject && pdfObject.contentWindow) {
        pdfObject.contentWindow.print();
      } else {
        window.print();
      }
    }
  </script>
</body>
</html>
